<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(circle at 10% 10%, #dbeafe 0%, transparent 30%),
                radial-gradient(circle at 90% 90%, #e9d5ff 0%, transparent 30%),
                #f8fafc;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .auth-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.12);
        }

        /* Logo / Header */

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111827;
            color: white;
            border-radius: 18px;

            font-size: 25px;
            font-weight: 700;

            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.18);
        }

        .brand h1 {
            color: #111827;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        /* Google Button */

        .google-btn {
            width: 100%;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            background: #ffffff;
            color: #1f2937;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: all 0.25s ease;
        }

        .google-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .google-btn:active {
            transform: translateY(0);
        }

        .google-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .google-icon {
            width: 21px;
            height: 21px;
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 25px 0;

            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e5e7eb;
        }

        /* Form */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 52px;

            padding: 0 15px;

            background: #ffffff;
            color: #111827;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: all 0.25s ease;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        /* Password */

        .password-input {
            padding-right: 65px !important;
        }

        .show-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #4f46e5;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .show-password:hover {
            color: #3730a3;
        }

        /* Forgot */

        .form-options {
            display: flex;
            justify-content: flex-end;

            margin-top: -4px;
            margin-bottom: 20px;
        }

        .forgot-password {
            border: none;
            background: transparent;

            color: #4f46e5;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Sign In */

        .email-signin-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: #111827;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .email-signin-btn:hover {
            background: #1f2937;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(17, 24, 39, 0.18);
        }

        .email-signin-btn:active {
            transform: translateY(0);
        }

        .email-signin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */

        .footer-text {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;
            font-size: 13px;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .auth-card {
                padding: 30px 22px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>


<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- Header -->

            <div class="brand">

                <div class="brand-logo">
                    A
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to continue to your account
                </p>

            </div>


            <!-- Google Login -->

            <button type="button" class="google-btn" id="googleBtn" onclick="SignLogin()">

                <svg class="google-icon" viewBox="0 0 24 24">

                    <path fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z" />

                    <path fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.5z" />

                    <path fill="#FBBC05"
                        d="M6.53 13.58A5.86 5.86 0 0 1 6.22 12c0-.55.1-1.08.31-1.58V7.89H3.28A9.5 9.5 0 0 0 2.25 12c0 1.53.37 2.98 1.03 4.11l3.25-2.53z" />

                    <path fill="#EA4335"
                        d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.5 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.72 5.39l3.25 2.53C7.3 8.11 9.46 6.39 12 6.39z" />

                </svg>

                <span id="googleText">
                    Continue with Google
                </span>

            </button>


            <!-- Divider -->

            <div class="divider">
                OR
            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email">

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input type="password" id="password" class="password-input" placeholder="Enter your password"
                        autocomplete="current-password">

                    <button type="button" class="show-password" id="showPasswordBtn" onclick="togglePassword()">
                        Show
                    </button>

                </div>

            </div>


            <!-- Forgot Password -->

            <div class="form-options">

                <button type="button" class="forgot-password" onclick="forgotPassword()">
                    Forgot Password?
                </button>

            </div>


            <!-- Email Sign In -->

            <button type="button" class="email-signin-btn" id="emailSignInBtn" onclick="emailSignIn()">
                Sign In
            </button>


            <!-- Footer -->

            <p class="footer-text">

                Don't have an account?

                <a href="#">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <!-- Firebase SDK -->

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>


    <script>

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================

        const firebaseConfig = {
            apiKey: "AIzaSyDMdzo8gfTmhrxa9jC4mvntOnbusEfdI4Y",
            authDomain: "quiz-app-50c35.firebaseapp.com",
            databaseURL: "https://quiz-app-50c35-default-rtdb.firebaseio.com",
            projectId: "quiz-app-50c35",
            storageBucket: "quiz-app-50c35.firebasestorage.app",
            messagingSenderId: "508326349807",
            appId: "1:508326349807:web:6236b0c074dee40bd3041a"

        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);


        // ==========================================
        // GOOGLE SIGN IN
        // ==========================================

        function SignLogin() {

            const googleBtn =
                document.getElementById("googleBtn");

            const googleText =
                document.getElementById("googleText");


            googleBtn.disabled = true;

            googleText.textContent = "Connecting...";


            const provider =
                new firebase.auth.GoogleAuthProvider();


            provider.setCustomParameters({
                prompt: "select_account"
            });


            firebase.auth()
                .signInWithPopup(provider)

                .then((result) => {

                    const user = result.user;

                    console.log(
                        "Google Sign In Successful"
                    );

                    console.log("Name:", user.displayName);
                    console.log("Email:", user.email);
                    console.log("UID:", user.uid);





                    // Dashboard redirect:
                    // window.location.href = "dashboard.html";

                })

                .catch((error) => {

                    console.error(
                        "Google Sign In Error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/popup-closed-by-user"
                    ) {

                        alert(
                            "Google Sign In cancelled."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/popup-blocked"
                    ) {

                        alert(
                            "Google popup was blocked. " +
                            "Please allow popups for this website."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/unauthorized-domain"
                    ) {

                        alert(
                            "This domain is not authorized in Firebase. " +
                            "Add your website domain in Firebase Console → " +
                            "Authentication → Settings → Authorized Domains."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/operation-not-allowed"
                    ) {

                        alert(
                            "Google Sign-In is not enabled in Firebase. " +
                            "Enable Google from Authentication → Sign-in method."
                        );

                    }

                    else {

                        alert(
                            "Google Sign In Error: " +
                            error.message
                        );

                    }

                })

                .finally(() => {

                    googleBtn.disabled = false;

                    googleText.textContent =
                        "Continue with Google";

                });

        }


        // ==========================================
        // EMAIL + PASSWORD SIGN IN
        // ==========================================

        function emailSignIn() {

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;


            if (email === "") {

                alert(
                    "Please enter your email."
                );

                document
                    .getElementById("email")
                    .focus();

                return;
            }


            if (password === "") {

                alert(
                    "Please enter your password."
                );

                document
                    .getElementById("password")
                    .focus();

                return;
            }


            const button =
                document.getElementById(
                    "emailSignInBtn"
                );


            button.disabled = true;

            button.textContent =
                "Signing in...";


            firebase.auth()
                .signInWithEmailAndPassword(
                    email,
                    password
                )

                .then((result) => {

                    const user =
                        result.user;


                    console.log(
                        "Email Sign In Successful"
                    );

                    console.log(
                        "Email:",
                        user.email
                    );

                    console.log(
                        "UID:",
                        user.uid
                    );


                    alert(
                        "Sign In Successful!"
                    );


                    // Dashboard redirect:
                    // window.location.href = "dashboard.html";

                })

                .catch((error) => {

                    console.error(
                        "Email Sign In Error:",
                        error
                    );


                    if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        alert(
                            "Please enter a valid email."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        alert(
                            "Invalid email or password."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        alert(
                            "No account found with this email."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        alert(
                            "Incorrect password."
                        );

                    }

                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        alert(
                            "Too many login attempts. " +
                            "Please try again later."
                        );

                    }

                    else {

                        alert(
                            error.message
                        );

                    }

                })

                .finally(() => {

                    button.disabled = false;

                    button.textContent =
                        "Sign In";

                });

        }


        // ==========================================
        // SHOW / HIDE PASSWORD
        // ==========================================

        function togglePassword() {

            const password =
                document.getElementById(
                    "password"
                );

            const button =
                document.getElementById(
                    "showPasswordBtn"
                );


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            }

            else {

                password.type = "password";

                button.textContent = "Show";

            }

        }


        // ==========================================
        // FORGOT PASSWORD
        // ==========================================

        function forgotPassword() {

            const email =
                document.getElementById("email")
                    .value
                    .trim();


            if (email === "") {

                alert(
                    "Please enter your email first."
                );

                document
                    .getElementById("email")
                    .focus();

                return;
            }


            firebase.auth()
                .sendPasswordResetEmail(email)

                .then(() => {

                    alert(
                        "Password reset email sent! " +
                        "Please check your inbox."
                    );

                })

                .catch((error) => {

                    console.error(
                        "Password Reset Error:",
                        error
                    );

                    alert(
                        error.message
                    );

                });

        }


        // ==========================================
        // AUTH STATE
        // ==========================================

        firebase.auth()
            .onAuthStateChanged((user) => {

                if (user) {

                    console.log(
                        "User is signed in:"
                    );

                    console.log(
                        user.email
                    );

                }

                else {

                    console.log(
                        "No user is signed in."
                    );

                }

            });

    </script>

</body>

</html>
